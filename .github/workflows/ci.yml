name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          # Dummy URL — only needed for prisma generate, not for actual DB use
          DATABASE_URL: postgresql://user:password@localhost:5432/recruitme

      - name: Lint
        run: npm run lint

      - name: Typecheck (next build)
        run: npm run build
        env:
          # Build-time dummies; runtime values come from Railway in prod
          DATABASE_URL: postgresql://user:password@localhost:5432/recruitme
          NEXTAUTH_SECRET: ci-build-only-not-for-runtime-use-32chars
          NEXTAUTH_URL: http://localhost:3000

      - name: Run tests
        run: npm run test
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/recruitme
