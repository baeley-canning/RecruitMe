# Reference SearXNG settings.yml for RecruitMe deployments.
#
# Copy this onto the `searxng-settings` Railway volume (mount path is
# usually /etc/searxng) and restart the searxng service. Without these two
# changes a stock SearXNG image returns HTML to our API client (no JSON),
# and the limiter blocks our app's requests as suspected bots — every
# search silently returns zero results.
#
# Verify after deploy with:
#   curl -sS "$SEARXNG_BASE_URL/search?q=site:linkedin.com/in+test&format=json" | head -c 200
# The response must start with `{"query":` (JSON), not `<!DOCTYPE html>`.

use_default_settings: true

general:
  instance_name: "RecruitMe SearXNG"

search:
  # The critical bit: enable JSON so our app can parse the response.
  # Without `json` in this list the server responds 200 with HTML.
  formats:
    - html
    - json
  safe_search: 0
  autocomplete: ""
  default_lang: "en"

server:
  # Disable the limiter — it blocks API-style requests (no Sec-Fetch-* headers,
  # no Accept-Language matching a browser, etc.) as bots. A self-hosted SearXNG
  # behind a Railway private network does not need an open-internet rate limiter.
  limiter: false
  image_proxy: false
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-Download-Options: noopen
    X-Robots-Tag: noindex, nofollow
    Referrer-Policy: no-referrer

# Bot detection: leave OFF for a private instance. If you later expose
# the instance publicly you'd re-enable this section.
botdetection:
  ip_limit:
    filter_link_local: false
    link_token: false
